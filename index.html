<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDISERVICE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f5f7;
  color:#172033;
}
header{
  background:#102a43;
  color:white;
  padding:28px 20px;
}
header h1{margin:0;font-size:30px}
header p{margin:5px 0 0;opacity:.8}
main{padding:18px;max-width:700px;margin:auto}
h2{margin:22px 0 10px}
.card{
  background:white;
  border-radius:16px;
  padding:17px;
  margin:10px 0;
  box-shadow:0 2px 10px #0000000d;
}
.store{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}
.arrow{font-size:22px;color:#64748b}
.hidden{display:none}
.back{
  border:0;
  background:none;
  color:#102a43;
  font-size:16px;
  padding:8px 0;
}
input,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d6dce2;
  border-radius:10px;
  font-size:16px;
  margin:6px 0 10px;
}
button.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  background:#102a43;
  color:white;
  font-size:16px;
  font-weight:600;
}
.work{
  background:white;
  border-radius:13px;
  padding:14px;
  margin:9px 0;
  box-shadow:0 2px 8px #0000000d;
}
.work.done{
  opacity:.55;
  text-decoration:line-through;
}
.work button{
  margin-top:9px;
  border:0;
  border-radius:8px;
  padding:8px 12px;
  background:#e8edf2;
  color:#172033;
}
</style>
</head>

<body>

<header>
  <h1>EDISERVICE</h1>
  <p>Gestione manutenzioni</p>
</header>

<main>

<div id="home">
  <h2>PIM</h2>
  <div id="pim"></div>

  <h2>AGORÀ</h2>
  <div id="agora"></div>

  <h2>IPERFAMILY</h2>
  <div id="iperfamily"></div>
</div>

<div id="negozio" class="hidden">
  <button class="back" onclick="home()">← Torna ai punti vendita</button>

  <div class="card">
    <h2 id="titoloNegozio"></h2>

    <input id="nuovoLavoro" placeholder="Scrivi il lavoro da fare...">

    <textarea id="noteLavoro" rows="3"
      placeholder="Note (facoltative)"></textarea>

    <button class="primary" onclick="aggiungiLavoro()">
      + Aggiungi lavoro
    </button>
  </div>

  <h2>Lavori da fare</h2>
  <div id="listaLavori"></div>
</div>

</main>

<script>

const puntiVendita = {

  PIM: [
    "Torresina",
    "Fontanile",
    "Torrevecchia 313",
    "Pietro Maffi",
    "Pineta Sacchetti",
    "Trionfale",
    "Igea",
    "Piedicavallo",
    "Mazzini",
    "Bravetta",
    "Cassia",
    "Flaminia",
    "Zambarelli",
    "Parioli",
    "Newton",
    "Biolchini",
    "Oderisi",
    "Tripoli",
    "Labaro",
    "San Paolo",
    "Malafede",
    "Cinecittà",
    "Casal Palocco",
    "Guidonia",
    "Nepi"
  ],

  "AGORÀ": [
    "Taverna",
    "Boccea",
    "Gregorio",
    "San Basilio",
    "Laurentina"
  ],

  IPERFAMILY: [
    "Iperfamily"
  ]
};

let negozioAttuale = "";

function dati() {
  return JSON.parse(localStorage.getItem("ediservice_lavori") || "{}");
}

function salva(d) {
  localStorage.setItem("ediservice_lavori", JSON.stringify(d));
}

function creaPuntiVendita() {

  for (const gruppo in puntiVendita) {

    const id =
      gruppo === "PIM" ? "pim" :
      gruppo === "AGORÀ" ? "agora" :
      "iperfamily";

    const contenitore = document.getElementById(id);

    puntiVendita[gruppo].forEach(nome => {

      const div = document.createElement("div");
      div.className = "card store";

      div.innerHTML =
        `<span>${nome}</span><span class="arrow">›</span>`;

      div.onclick = () => apriNegozio(nome);

      contenitore.appendChild(div);
    });
  }
}

function apriNegozio(nome) {

  negozioAttuale = nome;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("negozio").classList.remove("hidden");

  document.getElementById("titoloNegozio").textContent = nome;

  document.getElementById("nuovoLavoro").value = "";
  document.getElementById("noteLavoro").value = "";

  mostraLavori();
}

function home() {

  document.getElementById("negozio").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

function aggiungiLavoro() {

  const lavoro =
    document.getElementById("nuovoLavoro").value.trim();

  const note =
    document.getElementById("noteLavoro").value.trim();

  if (!lavoro) {
    alert("Scrivi prima il lavoro da fare.");
    return;
  }

  const d = dati();

  if (!d[negozioAttuale])
    d[negozioAttuale] = [];

  d[negozioAttuale].push({
    testo: lavoro,
    note: note,
    completato: false
  });

  salva(d);

  document.getElementById("nuovoLavoro").value = "";
  document.getElementById("noteLavoro").value = "";

  mostraLavori();
}

function mostraLavori() {

  const lista = document.getElementById("listaLavori");
  const d = dati();

  lista.innerHTML = "";

  const lavori = d[negozioAttuale] || [];

  if (lavori.length === 0) {
    lista.innerHTML =
      '<div class="card">Nessun lavoro inserito.</div>';
    return;
  }

  lavori.forEach((lavoro, indice) => {

    const div = document.createElement("div");

    div.className =
      "work" + (lavoro.completato ? " done" : "");

    div.innerHTML = `
      <strong>${lavoro.testo}</strong>
      ${lavoro.note ? `<p>${lavoro.note}</p>` : ""}
      <button onclick="completaLavoro(${indice})">
        ${lavoro.completato ? "Da rifare" : "Completato"}
      </button>
      <button onclick="eliminaLavoro(${indice})">
        Elimina
      </button>
    `;

    lista.appendChild(div);
  });
}

function completaLavoro(indice) {

  const d = dati();

  d[negozioAttuale][indice].completato =
    !d[negozioAttuale][indice].completato;

  salva(d);
  mostraLavori();
}

function eliminaLavoro(indice) {

  const d = dati();

  d[negozioAttuale].splice(indice,1);

  salva(d);
  mostraLavori();
}

creaPuntiVendita();

</script>

</body>
</html>
