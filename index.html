<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDISERVICE</title>

<link rel="icon" type="image/png" href="IMG_1571.png">
<link rel="apple-touch-icon" href="IMG_1571.png">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f5f7;
color:#111;
}

header{
background:white;
padding:25px 20px 20px;
text-align:center;
border-bottom:1px solid #ddd;
}

.logo{
width:100%;
max-width:300px;
max-height:130px;
object-fit:contain;
}

header p{
margin:10px 0 0;
color:#555;
font-size:18px;
}

main{
max-width:750px;
margin:auto;
padding:20px;
}

h2{
font-size:30px;
margin:28px 0 15px;
}

.group-title{
font-size:25px;
font-weight:700;
margin:28px 0 12px;
}


/* RIQUADRO LAVORI DA FARE */

.summary{
background:#555555;
color:white;
border-radius:28px;
padding:28px;
margin-bottom:35px;
}

.summary-title{
font-size:19px;
font-weight:600;
text-transform:uppercase;
}

.summary-number{
font-size:70px;
font-weight:700;
line-height:1;
margin:10px 0;
}

.summary-text{
font-size:19px;
color:#eeeeee;
}


/* LAVORI NELLA HOME */

.store-card{
background:white;
border-radius:20px;
padding:20px;
margin:12px 0;
box-shadow:0 3px 12px rgba(0,0,0,.06);
cursor:pointer;
}

.store-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.store-name{
font-size:22px;
font-weight:700;
}

.store-count{
background:#e8edf2;
color:#555555;
min-width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.task-list{
margin-top:15px;
}

.task-row{
padding:10px 0;
border-top:1px solid #eee;
font-size:17px;
}

.task-row:first-child{
border-top:0;
}

.task-row strong{
display:block;
}


/* NOME PUNTO VENDITA IN ROSSO */

.work-store-name{
color:#c62828;
font-size:23px;
font-weight:800;
margin-bottom:15px;
}

.task-note{
color:#666;
font-size:14px;
margin-top:4px;
}

.hidden{
display:none;
}

.empty{
background:white;
border-radius:18px;
padding:20px;
color:#666;
text-align:center;
}


/* PAGINA PUNTO VENDITA */

.back{
border:0;
background:none;
padding:5px 0 15px;
color:#555555;
font-size:17px;
}

.form-card{
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

input,
textarea{
width:100%;
border:1px solid #d5dbe1;
border-radius:11px;
padding:14px;
font-size:16px;
margin:7px 0 12px;
font-family:inherit;
}

.primary{
width:100%;
border:0;
border-radius:11px;
padding:14px;
background:#555555;
color:white;
font-size:17px;
font-weight:600;
}

.work{
background:white;
border-radius:18px;
padding:17px;
margin:12px 0;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.work.done{
opacity:.5;
}

.work.done .work-title{
text-decoration:line-through;
}

.work-title{
font-size:18px;
font-weight:700;
}

.work-note{
margin:8px 0;
color:#666;
}

.work-buttons{
display:flex;
gap:8px;
margin-top:12px;
}

.work-buttons button{
flex:1;
border:0;
border-radius:9px;
padding:10px;
font-size:14px;
background:#e8edf2;
}

.back-home{
margin-top:25px;
width:100%;
border:0;
background:#e8edf2;
border-radius:11px;
padding:13px;
font-size:16px;
}


/* PUNTI VENDITA */

.point-card{
background:white;
border-radius:20px;
padding:22px;
margin:12px 0;
box-shadow:0 3px 12px rgba(0,0,0,.06);
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
}

.point-name{
font-size:22px;
font-weight:700;
}

.point-arrow{
font-size:30px;
color:#666;
}


@media(max-width:500px){

main{
padding:16px;
}

h2{
font-size:28px;
}

.summary-number{
font-size:62px;
}

}

</style>
</head>


<body>


<header>

<img
class="logo"
src="IMG_1571.png"
alt="EDISERVICE"
>

<p>Gestione manutenzioni</p>

</header>


<main>


<!-- HOME -->

<div id="home">


<div class="summary">

<div class="summary-title">
Lavori da fare
</div>

<div
class="summary-number"
id="totaleLavori"
>
0
</div>

<div class="summary-text">
lavori aperti in tutti i punti vendita
</div>

</div>


<h2>Lavori da fare</h2>

<div id="lavoriHome"></div>


<div class="section">

<h2>Punti vendita</h2>


<div class="group-title">
PIM
</div>

<div id="pim"></div>


<div class="group-title">
AGORÀ
</div>

<div id="agora"></div>


<div class="group-title">
IPERFAMILY
</div>

<div id="iperfamily"></div>


</div>

</div>



<!-- PAGINA NEGOZIO -->

<div
id="negozio"
class="hidden"
>

<button
class="back"
onclick="tornaHome()"
>
← Torna ai punti vendita
</button>


<h2 id="titoloNegozio"></h2>


<div class="form-card">

<input
id="nuovoLavoro"
type="text"
placeholder="Scrivi il lavoro da fare..."
>

<textarea
id="noteLavoro"
rows="3"
placeholder="Note (facoltative)"
></textarea>


<button
class="primary"
onclick="aggiungiLavoro()"
>
+ Aggiungi lavoro
</button>

</div>


<h2>Lavori</h2>

<div id="listaLavori"></div>


<button
class="back-home"
onclick="tornaHome()"
>
Torna alla schermata principale
</button>


</div>

</main>



<script>


const puntiVendita={

PIM:[
"Torresina",
"Fontanile",
"Torrevecchia 313",
"Pietro Maffi",
"Pineta Sacchetti",
"Trionfale",
"Igea",
"Piedicavallo",
"Mazzini",
"Bravetta",
"Cassia",
"Flaminia",
"Zambarelli",
"Parioli",
"Newton",
"Biolchini",
"Oderisi",
"Tripoli",
"Labaro",
"San Paolo",
"Malafede",
"Cinecittà",
"Casal Palocco",
"Guidonia",
"Nepi"
],

"AGORÀ":[
"Taverna",
"Boccea",
"Gregorio",
"San Basilio",
"Laurentina"
],

"IPERFAMILY":[
"Iperfamily"
]

};


let negozioAttuale="";


function caricaDati(){

return JSON.parse(
localStorage.getItem("ediservice_lavori")||"{}"
);

}


function salvaDati(dati){

localStorage.setItem(
"ediservice_lavori",
JSON.stringify(dati)
);

}


function contaAperti(nome){

const dati=caricaDati();

const lavori=dati[nome]||[];

return lavori.filter(
lavoro=>!lavoro.completato
).length;

}


function creaPuntiVendita(){

creaGruppo("PIM","pim");

creaGruppo("AGORÀ","agora");

creaGruppo("IPERFAMILY","iperfamily");

}


function creaGruppo(gruppo,id){

const contenitore=
document.getElementById(id);

contenitore.innerHTML="";


puntiVendita[gruppo].forEach(nome=>{

const aperti=contaAperti(nome);


const card=
document.createElement("div");

card.className="point-card";


card.onclick=()=>{

apriNegozio(nome);

};


card.innerHTML=`

<div class="point-name">
${nome}
</div>

<div class="store-head">

<div class="store-count">
${aperti}
</div>

<div class="point-arrow">
›
</div>

</div>

`;


contenitore.appendChild(card);

});

}



function tuttiINegozi(){

let lista=[];


for(const gruppo in puntiVendita){

puntiVendita[gruppo]
.forEach(nome=>{

lista.push(nome);

});

}


return lista;

}



function aggiornaHome(){

const dati=caricaDati();

let totale=0;


for(const nome in dati){

const lavori=dati[nome]||[];

totale+=lavori.filter(
lavoro=>!lavoro.completato
).length;

}


document.getElementById(
"totaleLavori"
).textContent=totale;


const contenitore=
document.getElementById("lavoriHome");

contenitore.innerHTML="";


let trovati=false;


tuttiINegozi().forEach(nome=>{

const lavori=(dati[nome]||[])
.filter(
lavoro=>!lavoro.completato
);


if(lavori.length===0){

return;

}


trovati=true;


const card=
document.createElement("div");

card.className="store-card";


card.onclick=()=>{

apriNegozio(nome);

};


let html=`

<div class="work-store-name">
${nome}
</div>

`;


lavori.forEach(lavoro=>{

html+=`

<div class="task-row">

<strong>
${lavoro.testo}
</strong>

${
lavoro.note
?
`<div class="task-note">
${lavoro.note}
</div>`
:
""
}

</div>

`;

});


card.innerHTML=html;

contenitore.appendChild(card);

});


if(!trovati){

contenitore.innerHTML=`

<div class="empty">
Nessun lavoro da fare.
</div>

`;

}


creaPuntiVendita();

}



function apriNegozio(nome){

negozioAttuale=nome;


document.getElementById("home")
.classList.add("hidden");


document.getElementById("negozio")
.classList.remove("hidden");


document.getElementById(
"titoloNegozio"
).textContent=nome;


document.getElementById(
"nuovoLavoro"
).value="";


document.getElementById(
"noteLavoro"
).value="";


mostraLavori();


window.scrollTo({
top:0,
behavior:"smooth"
});

}



function tornaHome(){

document.getElementById("negozio")
.classList.add("hidden");


document.getElementById("home")
.classList.remove("hidden");


aggiornaHome();


window.scrollTo({
top:0,
behavior:"smooth"
});

}



function aggiungiLavoro(){

const lavoro=
document.getElementById(
"nuovoLavoro"
).value.trim();


const note=
document.getElementById(
"noteLavoro"
).value.trim();


if(!lavoro){

alert(
"Scrivi prima il lavoro da fare."
);

return;

}


const dati=caricaDati();


if(!dati[negozioAttuale]){

dati[negozioAttuale]=[];

}


dati[negozioAttuale].push({

testo:lavoro,

note:note,

completato:false

});


salvaDati(dati);


document.getElementById(
"nuovoLavoro"
).value="";


document.getElementById(
"noteLavoro"
).value="";


mostraLavori();

}



function mostraLavori(){

const lista=
document.getElementById(
"listaLavori"
);


const dati=caricaDati();


const lavori=
dati[negozioAttuale]||[];


lista.innerHTML="";


if(lavori.length===0){

lista.innerHTML=`

<div class="empty">
Nessun lavoro inserito per questo punto vendita.
</div>

`;

return;

}


lavori.forEach(
(lavoro,indice)=>{


const div=
document.createElement("div");


div.className=
"work"+
(
lavoro.completato
?
" done"
:
""
);


div.innerHTML=`

<div class="work-title">
${lavoro.testo}
</div>

${
lavoro.note
?
`<div class="work-note">
${lavoro.note}
</div>`
:
""
}

<div class="work-buttons">

<button
onclick="completaLavoro(${indice})"
>
${
lavoro.completato
?
"Da rifare"
:
"Completato"
}
</button>


<button
onclick="eliminaLavoro(${indice})"
>
Elimina
</button>

</div>

`;


lista.appendChild(div);

});

}



function completaLavoro(indice){

const dati=caricaDati();


dati[negozioAttuale][indice]
.completato=
!dati[negozioAttuale][indice]
.completato;


salvaDati(dati);


mostraLavori();

}



function eliminaLavoro(indice){

const dati=caricaDati();


if(!confirm(
"Vuoi eliminare questo lavoro?"
)){

return;

}


dati[negozioAttuale]
.splice(indice,1);


salvaDati(dati);


mostraLavori();

}



aggiornaHome();

</script>

</body>
</html>
