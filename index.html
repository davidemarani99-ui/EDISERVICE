<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>EDISERVICE</title>

<link
rel="icon"
type="image/png"
href="ediservice-icon.png"
>

<link
rel="apple-touch-icon"
href="ediservice-icon.png"
>


<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f5f7;
color:#111
}

header{
background:#fff;
padding:25px 20px 20px;
text-align:center;
border-bottom:1px solid #ddd
}

.logo{
width:100%;
max-width:300px;
max-height:130px;
object-fit:contain
}

header p{
margin:10px 0;
color:#555;
font-size:18px
}

main{
max-width:750px;
margin:auto;
padding:20px
}

h2{
font-size:30px;
margin:28px 0 15px
}

.group-title{
font-size:25px;
font-weight:700;
margin:28px 0 12px
}

.summary{
background:#555;
color:#fff;
border-radius:28px;
padding:28px;
margin-bottom:20px
}

.summary-title{
font-size:19px;
font-weight:600;
text-transform:uppercase
}

.summary-number{
font-size:70px;
font-weight:700;
margin:10px 0
}

.summary-text{
font-size:19px;
color:#eee
}

.store-card,
.form-card,
.work,
.point-card,
.empty,
.completed-card{
background:#fff;
border-radius:20px;
padding:20px;
margin:12px 0;
box-shadow:0 3px 12px #00000010
}

.store-card,
.point-card{
cursor:pointer
}

.point-card{
display:flex;
align-items:center;
justify-content:space-between
}

.point-name{
font-size:22px;
font-weight:700
}

.point-arrow{
font-size:30px;
color:#666
}

.store-count{
background:#e8edf2;
min-width:42px;
height:42px;
border-radius:50%;
display:inline-flex;
align-items:center;
justify-content:center;
font-weight:700
}

.work-store-name{
color:#c62828;
font-size:23px;
font-weight:800;
margin-bottom:15px
}

.task-row{
padding:10px 0;
border-top:1px solid #eee;
font-size:17px
}

.task-note,
.work-note{
color:#666;
font-size:14px;
margin-top:5px
}

.hidden{
display:none
}

.empty{
text-align:center;
color:#666
}

.back{
border:0;
background:none;
padding:5px 0 15px;
color:#555;
font-size:17px;
cursor:pointer
}

input,
textarea{
width:100%;
border:1px solid #d5dbe1;
border-radius:11px;
padding:14px;
font-size:16px;
margin:7px 0 12px;
font-family:inherit
}

.primary{
width:100%;
border:0;
border-radius:11px;
padding:14px;
background:#555;
color:white;
font-size:17px;
font-weight:600;
cursor:pointer
}

.primary:active{
transform:scale(.98)
}

.work.done{
opacity:.7
}

.work.done .work-title{
text-decoration:line-through
}

.work-title{
font-size:18px;
font-weight:700
}

.work-buttons{
display:flex;
gap:8px;
margin-top:12px
}

.work-buttons button{
flex:1;
border:0;
border-radius:9px;
padding:10px;
background:#e8edf2;
cursor:pointer
}

.back-home{
width:100%;
border:0;
background:#e8edf2;
border-radius:11px;
padding:13px;
font-size:16px;
cursor:pointer
}

.status{
text-align:center;
font-size:13px;
color:#777
}


/* =========================
   PULSANTE LAVORI COMPLETATI
========================= */

.completed-folder{
background:#fff;
border-radius:20px;
padding:20px;
margin:25px 0;
box-shadow:0 3px 12px #00000010;
cursor:pointer;
display:flex;
align-items:center;
justify-content:space-between
}

.completed-folder-left{
display:flex;
align-items:center;
gap:14px
}

.completed-folder-icon{
font-size:34px
}

.completed-folder-title{
font-size:21px;
font-weight:700
}

.completed-folder-subtitle{
font-size:14px;
color:#777;
margin-top:3px
}

.completed-folder-arrow{
font-size:30px;
color:#777
}


/* =========================
   PAGINA LAVORI COMPLETATI
========================= */

.completed-group-title{
font-size:25px;
font-weight:700;
margin:28px 0 12px
}

.completed-store{
background:#fff;
border-radius:20px;
padding:20px;
margin:12px 0;
box-shadow:0 3px 12px #00000010
}

.completed-store-name{
color:#c62828;
font-size:23px;
font-weight:800;
margin-bottom:12px
}

.completed-work{
padding:10px 0;
border-top:1px solid #eee;
font-size:17px
}

.completed-work:first-of-type{
border-top:0
}

.completed-check{
font-weight:700;
margin-right:7px
}

.completed-note{
color:#666;
font-size:14px;
margin-top:5px;
margin-left:24px
}

.completed-buttons{
display:flex;
gap:8px;
margin-top:10px;
margin-left:24px
}

.completed-buttons button{
border:0;
border-radius:9px;
padding:8px 12px;
background:#e8edf2;
cursor:pointer;
font-size:14px
}

</style>

</head>


<body>


<header>

<img
class="logo"
src="IMG_1571.png"
alt="EDISERVICE"
>

<p>
Gestione manutenzioni
</p>

<div
class="status"
id="status"
>
Connessione Firebase...
</div>

</header>


<main>


<!-- =========================
     HOME
========================= -->

<div id="home">


<div class="summary">

<div class="summary-title">
Lavori da fare
</div>

<div
class="summary-number"
id="totale"
>
0
</div>

<div class="summary-text">
lavori aperti in tutti i punti vendita
</div>

</div>


<!-- =========================
     CARTELLA LAVORI COMPLETATI
========================= -->

<div
class="completed-folder"
id="btnCompletati"
>

<div class="completed-folder-left">

<div class="completed-folder-icon">
📁
</div>

<div>

<div class="completed-folder-title">
Lavori completati
</div>

<div class="completed-folder-subtitle">
Visualizza tutti i lavori terminati
</div>

</div>

</div>

<div class="completed-folder-arrow">
›
</div>

</div>


<h2>
Lavori da fare
</h2>

<div id="homeLavori"></div>


<h2>
Punti vendita
</h2>


<div class="group-title">
PIM
</div>

<div id="pim"></div>


<div class="group-title">
AGORÀ
</div>

<div id="agora"></div>


<div class="group-title">
IPERFAMILY
</div>

<div id="iperfamily"></div>


</div>


<!-- =========================
     PAGINA NEGOZIO
========================= -->

<div
id="negozio"
class="hidden"
>


<button
class="back"
id="btnHome"
type="button"
>
← Torna ai punti vendita
</button>


<h2 id="titolo"></h2>


<div class="form-card">


<input
id="lavoro"
type="text"
placeholder="Scrivi il lavoro da fare..."
>


<textarea
id="note"
rows="3"
placeholder="Note (facoltative)"
></textarea>


<button
class="primary"
id="btnAggiungi"
type="button"
>
+ Aggiungi lavoro
</button>


</div>


<h2>
Lavori
</h2>

<div id="lista"></div>


<button
class="back-home"
id="btnHome2"
type="button"
>
Torna alla schermata principale
</button>


</div>


<!-- =========================
     PAGINA LAVORI COMPLETATI
========================= -->

<div
id="completati"
class="hidden"
>


<button
class="back"
id="btnHomeCompletati"
type="button"
>
← Torna alla schermata principale
</button>


<h2>
Lavori completati
</h2>


<div id="listaCompletati"></div>


<button
class="back-home"
id="btnHomeCompletati2"
type="button"
>
Torna alla schermata principale
</button>


</div>


</main>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
getAuth,
signInAnonymously,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
query,
where,
onSnapshot,
doc,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyC4XklYPsSktX4SlolgQRlkkQG4vveJ_xY",

authDomain:
"ediservice-bb88c.firebaseapp.com",

projectId:
"ediservice-bb88c",

storageBucket:
"ediservice-bb88c.firebasestorage.app",

messagingSenderId:
"420418885149",

appId:
"1:420418885149:web:2a07ba2ddfdafd31c798f4",

measurementId:
"G-BM489YWSY4"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =========================
   PUNTI VENDITA
========================= */

const punti={

PIM:[

"Torresina",
"Fontanile",
"Torrevecchia 313",
"Pietro Maffi",
"Pineta Sacchetti",
"Trionfale",
"Igea",
"Piedicavallo",
"Mazzini",
"Bravetta",
"Cassia",
"Flaminia",
"Zambarelli",
"Parioli",
"Newton",
"Biolchini",
"Oderisi",
"Tripoli",
"Labaro",
"San Paolo",
"Malafede",
"Cinecittà",
"Casal Palocco",
"Guidonia",
"Nepi"

],

AGORA:[

"Taverna",
"Boccea",
"Gregorio",
"San Basilio",
"Laurentina"

],

IPERFAMILY:[

"Iperfamily"

]

};


/* =========================
   VARIABILI
========================= */

let lavori=[];

let negozio="";

let utente=null;


/* =========================
   SICUREZZA TESTO
========================= */

function safe(x){

const d=
document.createElement("div");

d.textContent=x || "";

return d.innerHTML;

}


/* =========================
   CONTA LAVORI APERTI
========================= */

function conta(nome){

return lavori.filter(x=>

x.punto===nome &&
x.attivo &&
!x.completato

).length;

}


/* =========================
   CREA GRUPPI
========================= */

function gruppi(){

crea(
"PIM",
"pim"
);

crea(
"AGORA",
"agora"
);

crea(
"IPERFAMILY",
"iperfamily"
);

}


/* =========================
   CREA PUNTI VENDITA
========================= */

function crea(gruppo,id){

const box=
document.getElementById(id);

box.innerHTML="";


punti[gruppo].forEach(nome=>{


const div=
document.createElement("div");


div.className=
"point-card";


div.addEventListener(
"click",
()=>apri(nome)
);


div.innerHTML=`

<div class="point-name">
${safe(nome)}
</div>

<div>

<span class="store-count">
${conta(nome)}
</span>

<span class="point-arrow">
›
</span>

</div>

`;


box.appendChild(div);

});

}


/* =========================
   AGGIORNA HOME
========================= */

function aggiorna(){

const aperti=
lavori.filter(
x=>x.attivo&&!x.completato
);


document.getElementById(
"totale"
).textContent=
aperti.length;


const box=
document.getElementById(
"homeLavori"
);


box.innerHTML="";


if(!aperti.length){

box.innerHTML=
'<div class="empty">Nessun lavoro da fare.</div>';

}else{


Object.values(punti)
.flat()
.forEach(nome=>{


const ls=
aperti.filter(
x=>x.punto===nome
);


if(!ls.length)return;


const card=
document.createElement("div");


card.className=
"store-card";


card.addEventListener(
"click",
()=>apri(nome)
);


let html=`

<div class="work-store-name">
${safe(nome)}
</div>

`;


ls.forEach(x=>{


html+=`

<div class="task-row">

<strong>
${safe(x.testo)}
</strong>

${
x.note
?
`
<div class="task-note">
${safe(x.note)}
</div>
`
:
""
}

</div>

`;

});


card.innerHTML=html;


box.appendChild(card);

});

}


gruppi();

}


/* =========================
   APRI NEGOZIO
========================= */

function apri(nome){

negozio=nome;


document
.getElementById("home")
.classList
.add("hidden");


document
.getElementById("completati")
.classList
.add("hidden");


document
.getElementById("negozio")
.classList
.remove("hidden");


document
.getElementById("titolo")
.textContent=
nome;


document
.getElementById("lavoro")
.value="";


document
.getElementById("note")
.value="";


mostra();


window.scrollTo(
0,
0
);

}


/* =========================
   TORNA HOME
========================= */

function home(){

document
.getElementById("negozio")
.classList
.add("hidden");


document
.getElementById("completati")
.classList
.add("hidden");


document
.getElementById("home")
.classList
.remove("hidden");


aggiorna();


window.scrollTo(
0,
0
);

}


/* =========================
   APRI LAVORI COMPLETATI
========================= */

function apriCompletati(){

document
.getElementById("home")
.classList
.add("hidden");


document
.getElementById("negozio")
.classList
.add("hidden");


document
.getElementById("completati")
.classList
.remove("hidden");


mostraCompletati();


window.scrollTo(
0,
0
);

}


/* =========================
   AGGIUNGI LAVORO
========================= */

async function aggiungi(){


const input=
document.getElementById(
"lavoro"
);


const noteInput=
document.getElementById(
"note"
);


const testo=
input.value.trim();


const note=
noteInput.value.trim();


if(!testo){

alert(
"Scrivi prima il lavoro da fare."
);

return;

}


if(!negozio){

alert(
"Seleziona prima un punto vendita."
);

return;

}


if(!utente){

alert(
"Firebase non è ancora connesso."
);

return;

}


const bottone=
document.getElementById(
"btnAggiungi"
);


bottone.disabled=true;

bottone.textContent=
"Salvataggio...";


try{


await addDoc(

collection(
db,
"lavori"
),

{

punto:
negozio,

testo:
testo,

note:
note,

completato:
false,

attivo:
true,

creatoDa:
utente.uid,

creatoIl:
serverTimestamp()

}

);


input.value="";

noteInput.value="";


alert(
"Lavoro aggiunto correttamente."
);


}catch(error){


console.error(
"ERRORE FIREBASE:",
error
);


alert(
"Errore durante il salvataggio:\n\n"+
error.message
);


}finally{


bottone.disabled=false;

bottone.textContent=
"+ Aggiungi lavoro";

}

}


/* =========================
   MOSTRA LAVORI DEL NEGOZIO
========================= */

function mostra(){

const box=
document.getElementById(
"lista"
);


const ls=
lavori.filter(x=>

x.punto===negozio &&
x.attivo

);


box.innerHTML="";


if(!ls.length){

box.innerHTML=
`
<div class="empty">
Nessun lavoro inserito per questo punto vendita.
</div>
`;

return;

}


ls.forEach(x=>{


const div=
document.createElement("div");


div.className=
"work"+
(
x.completato
?
" done"
:
""
);


div.innerHTML=`

<div class="work-title">
${safe(x.testo)}
</div>

${
x.note
?
`
<div class="work-note">
${safe(x.note)}
</div>
`
:
""
}

<div class="work-buttons">

<button
type="button"
class="btnCompleta"
data-id="${x.id}"
>
${
x.completato
?
"Da rifare"
:
"Completato"
}
</button>


<button
type="button"
class="btnElimina"
data-id="${x.id}"
>
Elimina
</button>

</div>

`;


const btnCompleta=
div.querySelector(
".btnCompleta"
);


const btnElimina=
div.querySelector(
".btnElimina"
);


btnCompleta.addEventListener(
"click",
()=>{
completa(x.id)
}
);


btnElimina.addEventListener(
"click",
()=>{
elimina(x.id)
}
);


box.appendChild(div);

});

}


/* =========================
   MOSTRA LAVORI COMPLETATI
========================= */

function mostraCompletati(){

const box=
document.getElementById(
"listaCompletati"
);


box.innerHTML="";


const completati=
lavori.filter(x=>

x.attivo &&
x.completato

);


if(!completati.length){

box.innerHTML=
`
<div class="empty">
Nessun lavoro completato.
</div>
`;

return;

}


/*
   I gruppi vengono mostrati
   nell'ordine PIM,
   AGORÀ,
   IPERFAMILY
*/

const gruppiOrdine=[

{
nome:"PIM",
punti:punti.PIM
},

{
nome:"AGORÀ",
punti:punti.AGORA
},

{
nome:"IPERFAMILY",
punti:punti.IPERFAMILY
}

];


gruppiOrdine.forEach(gruppo=>{


const lavoriGruppo=
completati.filter(x=>

gruppo.punti.includes(x.punto)

);


if(!lavoriGruppo.length){

return;

}


const titolo=
document.createElement("div");


titolo.className=
"completed-group-title";


titolo.textContent=
gruppo.nome;


box.appendChild(titolo);


gruppo.punti.forEach(nome=>{


const ls=
lavoriGruppo.filter(
x=>x.punto===nome
);


if(!ls.length){

return;

}


const card=
document.createElement("div");


card.className=
"completed-store";


let html=`

<div class="completed-store-name">
${safe(nome)}
</div>

`;


ls.forEach(x=>{


html+=`

<div class="completed-work">

<div>

<span class="completed-check">
✓
</span>

<strong>
${safe(x.testo)}
</strong>

</div>

${
x.note
?
`
<div class="completed-note">
${safe(x.note)}
</div>
`
:
""
}

<div class="completed-buttons">

<button
type="button"
class="btnRifare"
data-id="${x.id}"
>
Da rifare
</button>

<button
type="button"
class="btnEliminaCompletato"
data-id="${x.id}"
>
Elimina
</button>

</div>

</div>

`;

});


card.innerHTML=
html;


const pulsantiRifare=
card.querySelectorAll(
".btnRifare"
);


pulsantiRifare.forEach(button=>{

button.addEventListener(
"click",
()=>completa(button.dataset.id)
);

});


const pulsantiElimina=
card.querySelectorAll(
".btnEliminaCompletato"
);


pulsantiElimina.forEach(button=>{

button.addEventListener(
"click",
()=>elimina(button.dataset.id)
);

});


box.appendChild(card);

});

});

}


/* =========================
   COMPLETA / DA RIFARE
========================= */

async function completa(id){


const x=
lavori.find(
y=>y.id===id
);


if(!x)return;


try{


await updateDoc(

doc(
db,
"lavori",
id
),

{

completato:
!x.completato

}

);


}catch(error){


console.error(error);


alert(
"Errore durante l'aggiornamento."
);

}

}


/* =========================
   ELIMINA
========================= */

async function elimina(id){


if(
!confirm(
"Vuoi eliminare questo lavoro?"
)
){

return;

}


try{


await updateDoc(

doc(
db,
"lavori",
id
),

{

attivo:false

}

);


}catch(error){


console.error(error);


alert(
"Errore durante l'eliminazione."
);

}

}


/* =========================
   COLLEGAMENTO PULSANTI
========================= */

document
.getElementById("btnAggiungi")
.addEventListener(
"click",
aggiungi
);


document
.getElementById("btnHome")
.addEventListener(
"click",
home
);


document
.getElementById("btnHome2")
.addEventListener(
"click",
home
);


document
.getElementById("btnCompletati")
.addEventListener(
"click",
apriCompletati
);


document
.getElementById("btnHomeCompletati")
.addEventListener(
"click",
home
);


document
.getElementById("btnHomeCompletati2")
.addEventListener(
"click",
home
);


/* =========================
   FIREBASE AUTH
========================= */

onAuthStateChanged(
auth,
user=>{


if(user){


utente=user;


document
.getElementById("status")
.textContent=
"Connesso a Firebase";


/*
   IMPORTANTE:
   prendiamo tutti i lavori
   attivi, compresi quelli
   completati.
*/

const q=
query(

collection(
db,
"lavori"
),

where(
"attivo",
"==",
true
)

);


onSnapshot(

q,

snap=>{


lavori=
snap.docs.map(
d=>({

id:d.id,

...d.data()

})
);


aggiorna();


if(
!document
.getElementById("negozio")
.classList
.contains("hidden")
){

mostra();

}


if(
!document
.getElementById("completati")
.classList
.contains("hidden")
){

mostraCompletati();

}

},


error=>{


console.error(
"ERRORE FIRESTORE:",
error
);


document
.getElementById("status")
.textContent=
"Errore Firestore";


alert(
"Errore Firestore:\n\n"+
error.message
);

}

);

}

});


/* =========================
   ACCESSO ANONIMO
========================= */

signInAnonymously(
auth
)

.catch(
error=>{


console.error(
"ERRORE AUTENTICAZIONE:",
error
);


document
.getElementById("status")
.textContent=
"Errore Firebase";


alert(
"Firebase non riesce a collegarsi.\n\n"+
error.message
);

}
);


/* =========================
   AVVIO
========================= */

aggiorna();
