<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDISERVICE</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f7;color:#111}
header{background:#fff;padding:25px 20px 20px;text-align:center;border-bottom:1px solid #ddd}
.logo{width:100%;max-width:300px;max-height:130px;object-fit:contain}
header p{margin:10px 0;color:#555;font-size:18px}
main{max-width:750px;margin:auto;padding:20px}
h2{font-size:30px;margin:28px 0 15px}
.group-title{font-size:25px;font-weight:700;margin:28px 0 12px}
.summary{background:#555;color:#fff;border-radius:28px;padding:28px;margin-bottom:35px}
.summary-title{font-size:19px;font-weight:600;text-transform:uppercase}
.summary-number{font-size:70px;font-weight:700;margin:10px 0}
.summary-text{font-size:19px;color:#eee}
.store-card,.form-card,.work,.point-card,.empty{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 3px 12px #00000010}
.store-card,.point-card{cursor:pointer}
.point-card{display:flex;align-items:center;justify-content:space-between}
.point-name{font-size:22px;font-weight:700}
.point-arrow{font-size:30px;color:#666}
.store-count{background:#e8edf2;min-width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.work-store-name{color:#c62828;font-size:23px;font-weight:800;margin-bottom:15px}
.task-row{padding:10px 0;border-top:1px solid #eee;font-size:17px}
.task-note,.work-note{color:#666;font-size:14px;margin-top:5px}
.hidden{display:none}
.empty{text-align:center;color:#666}
.back{border:0;background:none;padding:5px 0 15px;color:#555;font-size:17px}
input,textarea{width:100%;border:1px solid #d5dbe1;border-radius:11px;padding:14px;font-size:16px;margin:7px 0 12px;font-family:inherit}
.primary{width:100%;border:0;border-radius:11px;padding:14px;background:#555;color:white;font-size:17px;font-weight:600}
.work.done{opacity:.5}
.work.done .work-title{text-decoration:line-through}
.work-title{font-size:18px;font-weight:700}
.work-buttons{display:flex;gap:8px;margin-top:12px}
.work-buttons button{flex:1;border:0;border-radius:9px;padding:10px;background:#e8edf2}
.back-home{width:100%;border:0;background:#e8edf2;border-radius:11px;padding:13px;font-size:16px}
.status{text-align:center;font-size:13px;color:#777}
</style>
</head>

<body>

<header>
<img class="logo" src="IMG_1571.png" alt="EDISERVICE">
<p>Gestione manutenzioni</p>
<div class="status" id="status">Connessione Firebase...</div>
</header>

<main>

<div id="home">

<div class="summary">
<div class="summary-title">Lavori da fare</div>
<div class="summary-number" id="totale">0</div>
<div class="summary-text">lavori aperti in tutti i punti vendita</div>
</div>

<h2>Lavori da fare</h2>
<div id="homeLavori"></div>

<h2>Punti vendita</h2>

<div class="group-title">PIM</div>
<div id="pim"></div>

<div class="group-title">AGORÀ</div>
<div id="agora"></div>

<div class="group-title">IPERFAMILY</div>
<div id="iperfamily"></div>

</div>


<div id="negozio" class="hidden">

<button class="back" onclick="home()">← Torna ai punti vendita</button>

<h2 id="titolo"></h2>

<div class="form-card">

<input id="lavoro" placeholder="Scrivi il lavoro da fare...">

<textarea id="note" rows="3" placeholder="Note (facoltative)"></textarea>

<button class="primary" onclick="aggiungi()">+ Aggiungi lavoro</button>

</div>

<h2>Lavori</h2>

<div id="lista"></div>

<button class="back-home" onclick="home()">Torna alla schermata principale</button>

</div>

</main>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
onSnapshot,
doc,
updateDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyC4XklYPsSktX4SlolgQRlkkQG4vveJ_xY",

authDomain:"ediservice-bb88c.firebaseapp.com",

projectId:"ediservice-bb88c",

storageBucket:"ediservice-bb88c.firebasestorage.app",

messagingSenderId:"420418885149",

appId:"1:420418885149:web:2a07ba2ddfdafd31c798f4",

measurementId:"G-BM489YWSY4"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


const punti={

PIM:[
"Torresina","Fontanile","Torrevecchia 313",
"Pietro Maffi","Pineta Sacchetti","Trionfale",
"Igea","Piedicavallo","Mazzini","Bravetta",
"Cassia","Flaminia","Zambarelli","Parioli",
"Newton","Biolchini","Oderisi","Tripoli",
"Labaro","San Paolo","Malafede","Cinecittà",
"Casal Palocco","Guidonia","Nepi"
],

AGORA:[
"Taverna","Boccea","Gregorio","San Basilio","Laurentina"
],

IPERFAMILY:[
"Iperfamily"
]

};


let lavori=[];

let negozio="";

let utente=null;


function safe(x){

const d=document.createElement("div");

d.textContent=x||"";

return d.innerHTML;

}


function conta(nome){

return lavori.filter(x=>
x.punto===nome &&
x.attivo &&
!x.completato
).length;

}


function gruppi(){

crea("PIM","pim");

crea("AGORA","agora");

crea("IPERFAMILY","iperfamily");

}


function crea(gruppo,id){

const box=document.getElementById(id);

box.innerHTML="";

punti[gruppo].forEach(nome=>{

const div=document.createElement("div");

div.className="point-card";

div.onclick=()=>apri(nome);

div.innerHTML=`

<div class="point-name">${safe(nome)}</div>

<div>

<span class="store-count">
${conta(nome)}
</span>

<span class="point-arrow">›</span>

</div>

`;

box.appendChild(div);

});

}


function aggiorna(){

const aperti=lavori.filter(x=>x.attivo&&!x.completato);

document.getElementById("totale").textContent=aperti.length;

const box=document.getElementById("homeLavori");

box.innerHTML="";

if(!aperti.length){

box.innerHTML='<div class="empty">Nessun lavoro da fare.</div>';

}else{

Object.values(punti).flat().forEach(nome=>{

const ls=aperti.filter(x=>x.punto===nome);

if(!ls.length)return;

const card=document.createElement("div");

card.className="store-card";

card.onclick=()=>apri(nome);

let html=`<div class="work-store-name">${safe(nome)}</div>`;

ls.forEach(x=>{

html+=`

<div class="task-row">

<strong>${safe(x.testo)}</strong>

${x.note?
`<div class="task-note">${safe(x.note)}</div>`:""}

</div>`;

});

card.innerHTML=html;

box.appendChild(card);

});

}

gruppi();

}


function apri(nome){

negozio=nome;

document.getElementById("home").classList.add("hidden");

document.getElementById("negozio").classList.remove("hidden");

document.getElementById("titolo").textContent=nome;

document.getElementById("lavoro").value="";

document.getElementById("note").value="";

mostra();

window.scrollTo(0,0);

}


function home(){

document.getElementById("negozio").classList.add("hidden");

document.getElementById("home").classList.remove("hidden");

aggiorna();

window.scrollTo(0,0);

}


async function aggiungi(){

const testo=document.getElementById("lavoro").value.trim();

const note=document.getElementById("note").value.trim();

if(!testo){

alert("Scrivi prima il lavoro da fare.");

return;

}

if(!utente){

alert("Firebase non è ancora connesso.");

return;

}

await addDoc(collection(db,"lavori"),{

punto:negozio,

testo:testo,

note:note,

completato:false,

attivo:true,

creatoDa:utente.uid,

creatoIl:serverTimestamp()

});

document.getElementById("lavoro").value="";

document.getElementById("note").value="";

}


function mostra(){

const box=document.getElementById("lista");

const ls=lavori.filter(x=>
x.punto===negozio &&
x.attivo
);

box.innerHTML="";

if(!ls.length){

box.innerHTML=
'<div class="empty">Nessun lavoro inserito per questo punto vendita.</div>';

return;

}

ls.forEach(x=>{

const div=document.createElement("div");

div.className="work"+(x.completato?" done":"");

div.innerHTML=`

<div class="work-title">
${safe(x.testo)}
</div>

${x.note?
`<div class="work-note">${safe(x.note)}</div>`:""}

<div class="work-buttons">

<button onclick="completa('${x.id}')">
${x.completato?"Da rifare":"Completato"}
</button>

<button onclick="elimina('${x.id}')">
Elimina
</button>

</div>

`;

box.appendChild(div);

});

}


window.completa=async function(id){

const x=lavori.find(y=>y.id===id);

if(!x)return;

await updateDoc(

doc(db,"lavori",id),

{completato:!x.completato}

);

};


window.elimina=async function(id){

if(!confirm("Vuoi eliminare questo lavoro?"))return;

await updateDoc(

doc(db,"lavori",id),

{attivo:false}

);

};


onAuthStateChanged(auth,user=>{

if(user){

utente=user;

document.getElementById("status").textContent=
"Connesso a Firebase";

const q=query(

collection(db,"lavori"),

where("attivo","==",true)

);

onSnapshot(q,snap=>{

lavori=snap.docs.map(d=>({

id:d.id,

...d.data()

}));

aggiorna();

if(!document
.getElementById("negozio")
.classList.contains("hidden")){

mostra();

}

});

}

});


signInAnonymously(auth)

.catch(e=>{

console.error(e);

document.getElementById("status").textContent=
"Errore Firebase";

});


aggiorna();

</script>

</body>
</html>
